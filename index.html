<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />
            <title>Bar Estimation</title>
        <link rel="stylesheet" href="./styles.css" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@3"></script>
    </head>
    
    <body>
        <div>
            <div id="block-one">
                <h1>Bar Estimation</h1>
                <div class="stats-block">
                    <div id="stat-div-one">
                        <p id="prevGuessText" class="stat">Prev Guess:</p>
                        <p id="prevTrueText" class="stat">Prev True Value:</p>
                        <p id="prevErrorText" class="stat">Absolute Error:</p>
                        <hr>
                        <p id="meanErrorText" class="stat">Mean Absolute Error:</p>
                        <p id="stdDevText" class="stat">Standard deviation:</p>
                        <hr>
                        <button id="download-data">Download Data</button>
                    </div>
                    <div id="stat-div-two"> 
                        <button  class="carouselbtn" id="prevChart">
                            <img src="images/leftArrow.png" height="50">
                        </button>
                        <div class="carousel-page active">
                            <canvas id="scatterplot" class="graph"></canvas>
                        </div>
                        
                        <div class="carousel-page">
                            <div class="piecontainer">
                                <canvas id="piechart" class="graph"></canvas>
                            </div>
                        </div>

                        <div class="carousel-page">
                            <canvas id="boxplot" class="graph"></canvas>
                        </div>

                        <div class="carousel-page">
                            <div class="hans-container">
                                <img src="images/hans2.jpg">
                            </div>
                        </div>
                        <button  class="carouselbtn" id="nextChart">
                            <img src="images/rightArrow.png" height="50">
                        </button>
                    </div>
                </div>
            </div>
            <div id="block-two">
                <p id="error-message" class="hidden">Value entered is not a positive integer &le; 100</p>
                <p>Enter a percentage estimate of how full you think the progress bar is (integer value):</p>
                <form onsubmit="return handleClick(event)">
                    <input type="text" id="form-text">
                    <input type="submit">
                </form> 
                <div id="bar-container">
                    <progress id="estimate-bar" value="0" max="100"></progress>
                    
                </div>
            </div>
           
            
        </div>
        
        
    <script src="./script.js"></script>
    </body>
</html>
